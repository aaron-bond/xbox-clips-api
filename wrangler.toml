name = "xbox-clips-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Non-secret configuration. XBL_API_KEY is a secret: `wrangler secret put XBL_API_KEY`
# in production, `.dev.vars` locally. Never add it here - [vars] is committed in plain text.
[vars]
# Comma-separated. The deployed Pages origin plus local UI development. Never a wildcard:
# the shared upstream budget is worth protecting from other sites.
ALLOWED_ORIGINS = "https://xbox-clips-ui.pages.dev,http://localhost:5173"
# Where /share/:xuid/:clipId redirects human visitors.
UI_ORIGIN = "https://xbox-clips-ui.pages.dev"

[[kv_namespaces]]
binding = "CACHE"
# Replace with the id printed by `wrangler kv namespace create CACHE` before the first deploy.
id = "00000000000000000000000000000000"

# Per-IP inbound limit protecting the shared upstream budget. Costs no KV writes.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
